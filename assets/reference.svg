<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"><rect width="1200" height="630" fill="#10151b"/><text x="65" y="86" fill="#f7fbff" font-family="Arial" font-size="41" font-weight="700">Mobile Carbon Capture Systems Model</text><text x="65" y="130" fill="#9ed0f5" font-family="Arial" font-size="21">A route is a dynamic mass-and-energy system, not a single capture percentage</text><g font-family="Arial" font-size="21" text-anchor="middle"><rect x="55" y="225" width="210" height="112" rx="18" fill="#18334a"/><text x="160" y="276" fill="white">Route load</text><text x="160" y="307" fill="#9ed0f5">+ exhaust</text><rect x="345" y="225" width="210" height="112" rx="18" fill="#1c4964"/><text x="450" y="276" fill="white">Capture</text><text x="450" y="307" fill="#9ed0f5">throughput</text><rect x="635" y="225" width="210" height="112" rx="18" fill="#205f75"/><text x="740" y="276" fill="white">Buffer + depot</text><text x="740" y="307" fill="#b6e7ff">schedule</text><rect x="925" y="225" width="220" height="112" rx="18" fill="#267989"/><text x="1035" y="276" fill="white">Net avoided</text><text x="1035" y="307" fill="#d1f7ff">CO₂</text></g><g stroke="#6dd6e7" stroke-width="5"><path d="M265 281H340"/><path d="M555 281H630"/><path d="M845 281H920"/></g><text x="65" y="515" fill="#d5e8f6" font-family="Arial" font-size="25">Mass conservation • storage saturation • heat recovery • payload penalty • Pareto design</text></svg>
